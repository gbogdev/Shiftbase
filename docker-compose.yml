# Local development. For production use docker-compose.prod.yml (see docs/OPERATIONS.md).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shiftbase
      POSTGRES_PASSWORD: dev-only-password
      POSTGRES_DB: shiftbase
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftbase"]
      interval: 5s
      retries: 10
  web:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DEBUG: "true"
      SECRET_KEY: dev-only-insecure-key
      DATABASE_URL: postgres://shiftbase:dev-only-password@db:5432/shiftbase
      SECURE_SSL_REDIRECT: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --reload"
    ports: ["8000:8000"]
volumes:
  pgdata:

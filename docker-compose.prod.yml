# Production-shaped stack: Caddy (automatic HTTPS) -> gunicorn -> PostgreSQL. Not tested against a real domain by the authors of this repo; follow docs/SECURITY.md before going live.
services:
  db:
    image: postgres:16
    env_file: .env
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      retries: 10
  web:
    build: .
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    restart: unless-stopped
  periodic:
    build: .
    env_file: .env
    depends_on: [web]
    command: sh -c "while true; do python manage.py run_periodic; sleep 300; done"
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]
    restart: unless-stopped
volumes:
  pgdata:
  caddy_data:

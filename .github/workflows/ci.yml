name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: shiftbase, POSTGRES_PASSWORD: ci-password, POSTGRES_DB: shiftbase }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shiftbase" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://shiftbase:ci-password@localhost:5432/shiftbase
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: SECRET_KEY=ci python manage.py makemigrations --check --dry-run
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
